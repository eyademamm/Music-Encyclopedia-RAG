[project]
name = "music-rag"
version = "0.1.0"
description = "Music Encyclopedia RAG - LLM Zoomcamp final project"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "minsearch>=0.2",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "tqdm>=4.66",
    "pydantic>=2.8",
    "onnxruntime>=1.28.0",
    "tokenizers>=0.23.1",
    "huggingface-hub>=1.27.0",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
