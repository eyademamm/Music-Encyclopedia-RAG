<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Crate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@18.0.11/lib/marked.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.14/dist/purify.min.js"></script>
<style>
  /* ========== PALETTE ========== */
  :root {
    --bg-deep:          #0f0c0c;
    --bg-surface:       #1a1416;
    --bg-surface-alt:   #241c1f;
    --accent-primary:   #8b2252;
    --accent-secondary: #c4727a;
    --accent-hover:     #a03060;
    --accent-glow:      rgba(139, 34, 82, 0.3);
    --text-primary:     #f8f0e3;
    --text-secondary:   #c4b5a5;
    --text-muted:       #7a6b60;
    --border:           #2e2224;
    --shadow:           rgba(0, 0, 0, 0.5);
    --error-red:        #d94444;
    --success-green:    #5a9a5a;
  }

  /* ========== RESET & BASE ========== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 24px 60px;
    min-height: 100vh;
    color: var(--text-primary);

    /* Wood-grain textured background */
    background-color: var(--bg-deep);
    background-image:
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 40px,
        rgba(255,255,255,0.008) 40px,
        rgba(255,255,255,0.008) 41px
      ),
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(80,40,30,0.06) 2px,
        rgba(80,40,30,0.06) 4px
      ),
      radial-gradient(ellipse at 50% 0%, rgba(139,34,82,0.06) 0%, transparent 70%);
  }

  /* ========== HEADER ========== */
  .header {
    text-align: center;
    margin-bottom: 36px;
  }
  .header-title {
    font-family: 'Playfair Display', serif;
    font-size: 38px;
    font-weight: 700;
    color: var(--text-primary);
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .vinyl-icon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
  }
  .subtitle {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--accent-secondary);
    margin-top: 6px;
  }

  /* ========== SEARCH BAR ========== */
  .search-bar {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 20px;
  }
  .search-input {
    flex: 1;
    padding: 16px 20px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-surface);
    color: var(--text-primary);
    box-shadow: inset 0 2px 4px var(--shadow);
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .search-input::placeholder {
    color: var(--text-muted);
  }
  .search-input:focus {
    outline: none;
    border-color: var(--accent-primary);
    box-shadow: 0 0 0 3px var(--accent-glow), inset 0 2px 4px var(--shadow);
  }
  .search-input:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* ========== DROP THE NEEDLE BUTTON ========== */
  .needle-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 22px;
    font-size: 15px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    border-radius: 28px;
    border: none;
    cursor: pointer;
    white-space: nowrap;
    color: var(--text-primary);
    background: var(--accent-primary);
    box-shadow:
      0 4px 12px rgba(139, 34, 82, 0.4),
      0 2px 4px rgba(0,0,0,0.3),
      inset 0 1px 1px rgba(255,255,255,0.1);
    transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
  }
  .needle-btn:hover:not(:disabled) {
    background: var(--accent-hover);
    box-shadow:
      0 6px 18px rgba(139, 34, 82, 0.5),
      0 3px 6px rgba(0,0,0,0.3),
      inset 0 1px 1px rgba(255,255,255,0.12);
  }
  .needle-btn:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow:
      0 1px 4px rgba(139, 34, 82, 0.3),
      inset 0 2px 4px rgba(0,0,0,0.3);
  }
  .needle-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }
  .needle-btn svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  /* ========== EXAMPLE CHIPS ========== */
  .chips-container {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 28px;
  }
  .chips-container.hidden { display: none; }

  .chip {
    padding: 8px 16px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    color: var(--accent-secondary);
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }
  .chip:hover {
    border-color: var(--accent-primary);
    color: var(--text-primary);
    background: var(--bg-surface-alt);
  }

  /* ========== VINYL LOADING ANIMATION ========== */
  .vinyl-container {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 40px 0;
    position: relative;
    height: 200px;
  }
  .vinyl-container.hidden { display: none; }

  .vinyl-record {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: repeating-radial-gradient(
      circle at center,
      #111 0px,
      #1a1a1a 1px,
      #111 4px
    );
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px var(--shadow);
  }
  .vinyl-label {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent-primary), #6b1a40);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid rgba(255,255,255,0.15);
  }
  .vinyl-hole {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #000;
  }

  .vinyl-container.spinning .vinyl-record {
    animation: spin 1.8s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .tonearm {
    position: absolute;
    top: 8px;
    right: calc(50% - 115px);
    width: 36px;
    height: 130px;
    transform-origin: 18px 18px;
    transform: rotate(-30deg);
    z-index: 10;
  }
  .tonearm-base {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #3a3a3a;
    border: 2px solid #222;
    position: absolute;
    top: 0;
    left: 0;
  }
  .tonearm-arm {
    width: 6px;
    height: 110px;
    background: linear-gradient(to bottom, #c0c0c0, #888);
    position: absolute;
    top: 18px;
    left: 15px;
    border-radius: 3px;
  }
  .tonearm-head {
    width: 12px;
    height: 20px;
    background: #222;
    position: absolute;
    bottom: -8px;
    left: 12px;
    transform: rotate(20deg);
    border-radius: 1px;
  }

  .vinyl-container.spinning .tonearm {
    animation: lower-needle 0.8s ease-out forwards;
  }
  @keyframes lower-needle {
    from { transform: rotate(-30deg); }
    to   { transform: rotate(-5deg); }
  }

  .loading-text {
    text-align: center;
    margin-top: -20px;
    margin-bottom: 20px;
    color: var(--accent-secondary);
    font-style: italic;
    font-size: 14px;
  }
  .loading-text.hidden { display: none; }

  /* ========== ANSWER CARD ========== */
  #answer-container {
    display: none;
    margin-top: 8px;
  }
  #answer-container.visible {
    display: block;
    animation: fadeSlideIn 0.5s ease-out;
  }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  #answer-card {
    background: var(--bg-surface);
    border-radius: 14px;
    padding: 28px 28px 24px;
    border-left: 4px solid var(--accent-primary);
    box-shadow: 0 4px 16px var(--shadow);
    margin-bottom: 20px;
    position: relative;

    /* Subtle paper-grain texture */
    background-image:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(255,255,255,0.005) 3px,
        rgba(255,255,255,0.005) 4px
      );
  }
  .liner-notes-label {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--accent-secondary);
    margin-bottom: 16px;
  }

  /* ========== MARKDOWN CONTENT ========== */
  .answer-content {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    line-height: 1.75;
    color: var(--text-primary);
  }
  .answer-content h1, .answer-content h2, .answer-content h3 {
    font-family: 'Playfair Display', serif;
    color: var(--text-primary);
    margin-top: 1em;
    margin-bottom: 0.4em;
  }
  .answer-content h1 { font-size: 1.4em; }
  .answer-content h2 { font-size: 1.2em; }
  .answer-content h3 { font-size: 1.05em; }
  .answer-content p {
    margin-bottom: 0.8em;
  }
  .answer-content strong {
    color: #fff;
  }
  .answer-content em {
    color: var(--accent-secondary);
  }
  .answer-content ul, .answer-content ol {
    padding-left: 1.5em;
    margin-bottom: 0.8em;
  }
  .answer-content li {
    margin-bottom: 0.3em;
  }
  .answer-content li::marker {
    color: var(--accent-secondary);
  }
  .answer-content code {
    font-family: 'Courier New', monospace;
    background: rgba(255,255,255,0.06);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
  }
  .answer-content a {
    color: var(--accent-secondary);
    text-decoration: none;
  }
  .answer-content a:hover {
    text-decoration: underline;
  }

  /* Typing cursor */
  .answer-content.typing::after {
    content: '▌';
    color: var(--accent-secondary);
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  /* ========== SOURCE PILLS ========== */
  .sources-section {
    margin-top: 16px;
  }
  .sources-title {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
    font-weight: 500;
  }
  .sources {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .source-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-surface-alt);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--text-secondary);
    transition: border-color 0.2s, color 0.2s;
  }
  .source-pill:hover {
    border-color: var(--accent-primary);
    color: var(--text-primary);
  }
  .source-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-primary);
    border: 1px solid var(--accent-secondary);
    flex-shrink: 0;
  }

  /* ========== FEEDBACK ========== */
  .fb {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .fb.visible { opacity: 1; }

  .fb button {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 2px 6px var(--shadow), inset 0 1px 1px rgba(255,255,255,0.04);
    transition: all 0.2s;
  }
  .fb button:hover {
    color: var(--accent-secondary);
    border-color: var(--accent-primary);
    box-shadow: 0 0 0 2px var(--accent-glow);
  }
  .fb button:active {
    box-shadow: inset 0 2px 6px var(--shadow);
    transform: translateY(1px);
  }
  #fb-thanks {
    margin-top: 20px;
    color: var(--accent-secondary);
    font-style: italic;
    font-size: 14px;
    display: none;
  }

  /* ========== TOAST NOTIFICATION ========== */
  .toast {
    position: fixed;
    top: 24px;
    right: 24px;
    max-width: 380px;
    padding: 16px 20px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--error-red);
    border-radius: 12px;
    box-shadow: 0 8px 24px var(--shadow);
    color: var(--text-primary);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    z-index: 1000;
    animation: toastIn 0.3s ease-out;
  }
  .toast.fade-out {
    animation: toastOut 0.3s ease-in forwards;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(40px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes toastOut {
    from { opacity: 1; transform: translateX(0); }
    to   { opacity: 0; transform: translateX(40px); }
  }
  .toast-msg { flex: 1; line-height: 1.4; }
  .toast-close {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
    padding: 0;
    line-height: 1;
  }
  .toast-close:hover { color: var(--text-primary); }

  /* ========== CONVERSATION HISTORY ========== */
  .conversation-toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 20px;
  }
  .new-chat-btn, .conversation-delete {
    border: 1px solid var(--border);
    color: var(--text-secondary);
    background: var(--bg-surface-alt);
    border-radius: 9px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .new-chat-btn { padding: 9px 13px; font-weight: 600; }
  .conversation-delete { padding: 6px 9px; font-size: 12px; }
  .new-chat-btn:hover, .conversation-delete:hover {
    border-color: var(--accent-primary);
    color: var(--text-primary);
  }
  .conversation-list {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    flex: 1;
  }
  .conversation-item {
    min-width: 140px;
    max-width: 210px;
    padding: 9px 11px;
    border: 1px solid var(--border);
    background: var(--bg-surface);
    border-radius: 9px;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .conversation-item.active {
    border-color: var(--accent-primary);
    color: var(--text-primary);
    background: var(--bg-surface-alt);
  }
  .message-list { display: grid; gap: 16px; margin-bottom: 20px; }
  .message-user {
    justify-self: end;
    max-width: 86%;
    padding: 12px 15px;
    color: var(--text-primary);
    background: var(--accent-primary);
    border-radius: 14px 14px 3px 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .message-assistant {
    background: var(--bg-surface);
    border-left: 4px solid var(--accent-primary);
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 4px 16px var(--shadow);
  }
  .message-assistant .fb { opacity: 1; margin-top: 16px; }
  .message-assistant .fb.hidden, .message-assistant .fb-thanks { display: none; }
  .message-assistant .fb-thanks.visible { display: block; margin-top: 16px; color: var(--accent-secondary); font-style: italic; }
  .empty-transcript { color: var(--text-muted); text-align: center; padding: 20px 0; font-style: italic; }

  /* ========== RESPONSIVE ========== */
  @media (max-width: 600px) {
    body { padding: 24px 16px 40px; }
    .header-title { font-size: 28px; }
    .search-bar { flex-direction: column; }
    .needle-btn { width: 100%; justify-content: center; }
    .chips-container { justify-content: center; }
    #answer-card { padding: 20px 18px; }
    .conversation-toolbar { align-items: stretch; flex-wrap: wrap; }
    .conversation-list { order: 2; flex-basis: 100%; }
  }
</style>
</head>
<body>

  <!-- ====== HEADER ====== -->
  <div class="header">
    <div class="header-title">
      <svg class="vinyl-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="48" stroke="var(--text-secondary)" stroke-width="2" fill="#111"/>
        <circle cx="50" cy="50" r="38" stroke="var(--text-muted)" stroke-width="0.5" fill="none"/>
        <circle cx="50" cy="50" r="30" stroke="var(--text-muted)" stroke-width="0.5" fill="none"/>
        <circle cx="50" cy="50" r="22" stroke="var(--text-muted)" stroke-width="0.5" fill="none"/>
        <circle cx="50" cy="50" r="16" fill="var(--accent-primary)" stroke="var(--accent-secondary)" stroke-width="1"/>
        <circle cx="50" cy="50" r="4" fill="#0f0c0c"/>
      </svg>
      The Crate
    </div>
    <p class="subtitle">Dig through the stacks</p>
  </div>

  <div class="conversation-toolbar">
    <button class="new-chat-btn" id="new-chat-btn" type="button">+ New Chat</button>
    <div class="conversation-list" id="conversation-list" aria-label="Previous conversations"></div>
    <button class="conversation-delete" id="delete-chat-btn" type="button" disabled>Delete</button>
  </div>

  <!-- ====== SEARCH BAR ====== -->
  <div class="search-bar">
    <input class="search-input" id="q" placeholder="Ask about any artist, genre, or era..." />
    <button class="needle-btn" id="ask-btn" type="button">
      <!-- Tonearm / needle icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="16" r="5" fill="none"/>
        <circle cx="8" cy="16" r="1.5" fill="currentColor" stroke="none"/>
        <line x1="12" y1="13" x2="20" y2="3"/>
        <circle cx="20.5" cy="2.5" r="1.5" fill="none"/>
      </svg>
      Drop the Needle
    </button>
  </div>

  <!-- ====== EXAMPLE CHIPS ====== -->
  <div class="chips-container" id="chips">
    <button class="chip" onclick="askChip(this)">Who were the members of Pink Floyd?</button>
    <button class="chip" onclick="askChip(this)">What are the lyrics to Bohemian Rhapsody?</button>
    <button class="chip" onclick="askChip(this)">What genre did Fela Kuti pioneer?</button>
    <button class="chip" onclick="askChip(this)">Tell me about Tame Impala</button>
  </div>

  <!-- ====== VINYL LOADING ANIMATION ====== -->
  <div id="vinyl-container" class="vinyl-container hidden">
    <div class="vinyl-record">
      <div class="vinyl-label"><div class="vinyl-hole"></div></div>
    </div>
    <div class="tonearm">
      <div class="tonearm-arm"></div>
      <div class="tonearm-head"></div>
      <div class="tonearm-base"></div>
    </div>
  </div>
  <div id="loading-text" class="loading-text hidden">Spinning up...</div>

  <div id="conversation-messages" class="message-list" aria-live="polite"></div>

<script>
const state = { conversations: [], activeConversationId: null, messages: [], loading: false };
const ACTIVE_CONVERSATION_KEY = 'the-crate-active-conversation';
const loadingPhrases = ['Spinning up…', 'Flipping through the crates…', 'Pulling a deep cut…', 'Dusting off the vinyl…', 'Queuing up the B-side…'];

marked.setOptions({ breaks: true, gfm: true });
const markdownSanitizerOptions = {
  ALLOWED_TAGS: ['p', 'br', 'strong', 'em', 'del', 'a', 'ul', 'ol', 'li', 'blockquote', 'code', 'pre', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'hr', 'table', 'thead', 'tbody', 'tr', 'th', 'td'],
  ALLOWED_ATTR: ['href', 'title'], RETURN_DOM_FRAGMENT: true
};

function renderMarkdownSafely(text, element) {
  if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') {
    element.textContent = text;
    return;
  }
  element.replaceChildren(DOMPurify.sanitize(marked.parse(text), markdownSanitizerOptions));
}

function showToast(message) {
  document.querySelectorAll('.toast').forEach(toast => toast.remove());
  const toast = document.createElement('div');
  toast.className = 'toast';
  const text = document.createElement('span');
  text.className = 'toast-msg';
  text.textContent = String(message);
  const close = document.createElement('button');
  close.className = 'toast-close'; close.type = 'button'; close.textContent = '✕';
  close.addEventListener('click', () => toast.remove());
  toast.append(text, close); document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 6000);
}

function renderSources(sources, element) {
  element.replaceChildren();
  (sources || []).forEach(source => {
    const pill = document.createElement('span'); pill.className = 'source-pill';
    const dot = document.createElement('span'); dot.className = 'source-dot';
    pill.append(dot, document.createTextNode(String(source))); element.appendChild(pill);
  });
}

function renderConversationList() {
  const list = document.getElementById('conversation-list');
  list.replaceChildren();
  state.conversations.forEach(conversation => {
    const button = document.createElement('button');
    button.type = 'button'; button.className = 'conversation-item';
    if (conversation.id === state.activeConversationId) button.classList.add('active');
    button.textContent = conversation.title;
    button.title = conversation.title;
    button.addEventListener('click', () => openConversation(conversation.id));
    list.appendChild(button);
  });
  document.getElementById('delete-chat-btn').disabled = !state.activeConversationId || state.loading;
}

function renderMessages() {
  const list = document.getElementById('conversation-messages');
  list.replaceChildren();
  if (!state.messages.length) {
    const empty = document.createElement('p'); empty.className = 'empty-transcript';
    empty.textContent = 'Start a fresh side of the record.'; list.appendChild(empty); return;
  }
  state.messages.forEach(message => {
    if (message.role === 'user') {
      const bubble = document.createElement('div'); bubble.className = 'message-user';
      bubble.textContent = message.content; list.appendChild(bubble); return;
    }
    const card = document.createElement('article'); card.className = 'message-assistant';
    const label = document.createElement('div'); label.className = 'liner-notes-label'; label.textContent = 'Liner Notes';
    const answer = document.createElement('div'); answer.className = 'answer-content'; renderMarkdownSafely(message.content, answer);
    card.append(label, answer);
    if (message.sources && message.sources.length) {
      const section = document.createElement('div'); section.className = 'sources-section';
      const heading = document.createElement('div'); heading.className = 'sources-title'; heading.textContent = 'From the collection';
      const sources = document.createElement('div'); sources.className = 'sources'; renderSources(message.sources, sources);
      section.append(heading, sources); card.appendChild(section);
    }
    if (message.interaction_id) {
      const feedback = document.createElement('div'); feedback.className = 'fb';
      const thanks = document.createElement('div'); thanks.className = 'fb-thanks'; thanks.textContent = 'Noted! 🎶';
      if (message.feedback) {
        feedback.classList.add('hidden'); thanks.classList.add('visible');
      } else {
        [[1, '👍 Solid track'], [-1, '👎 Skip']].forEach(([value, labelText]) => {
          const button = document.createElement('button'); button.type = 'button'; button.textContent = labelText;
          button.addEventListener('click', () => sendFeedback(message, value, feedback, thanks)); feedback.appendChild(button);
        });
      }
      card.append(feedback, thanks);
    }
    list.appendChild(card);
  });
  list.lastElementChild?.scrollIntoView({ block: 'end', behavior: 'smooth' });
}

function setLoading(loading) {
  state.loading = loading;
  const button = document.getElementById('ask-btn'); const input = document.getElementById('q');
  button.disabled = loading; input.disabled = loading;
  document.getElementById('new-chat-btn').disabled = loading;
  button.textContent = loading ? '⏳ Searching…' : 'Drop the Needle';
  renderConversationList();
  if (!loading) input.focus();
}

async function readError(response) {
  try { return (await response.json()).detail || `Server returned ${response.status}`; }
  catch (_) { return `Server returned ${response.status}`; }
}

async function refreshConversations() {
  const response = await fetch('/conversations');
  if (!response.ok) throw new Error(await readError(response));
  state.conversations = (await response.json()).conversations || [];
  renderConversationList();
}

async function createConversation() {
  const response = await fetch('/conversations', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  if (!response.ok) throw new Error(await readError(response));
  const conversation = await response.json();
  state.activeConversationId = conversation.id; state.messages = [];
  localStorage.setItem(ACTIVE_CONVERSATION_KEY, conversation.id);
  await refreshConversations(); renderMessages();
}

async function openConversation(conversationId) {
  if (state.loading || conversationId === state.activeConversationId) return;
  const response = await fetch(`/conversations/${encodeURIComponent(conversationId)}`);
  if (response.status === 404) {
    localStorage.removeItem(ACTIVE_CONVERSATION_KEY); await refreshConversations();
    if (state.conversations.length) return openConversation(state.conversations[0].id);
    return createConversation();
  }
  if (!response.ok) return showToast(await readError(response));
  const data = await response.json();
  state.activeConversationId = data.conversation.id; state.messages = data.messages || [];
  localStorage.setItem(ACTIVE_CONVERSATION_KEY, state.activeConversationId);
  renderConversationList(); renderMessages();
}

async function deleteActiveConversation() {
  if (!state.activeConversationId || state.loading) return;
  const deletedId = state.activeConversationId;
  const response = await fetch(`/conversations/${encodeURIComponent(deletedId)}`, { method: 'DELETE' });
  if (response.status !== 204 && response.status !== 404) return showToast(await readError(response));
  localStorage.removeItem(ACTIVE_CONVERSATION_KEY);
  state.activeConversationId = null; state.messages = [];
  await refreshConversations();
  if (state.conversations.length) await openConversation(state.conversations[0].id);
  else await createConversation();
}

async function ask() {
  const input = document.getElementById('q'); const question = input.value.trim();
  if (!question || state.loading) return;
  if (!state.activeConversationId) {
    try { await createConversation(); } catch (error) { showToast(error.message); return; }
  }
  const conversationId = state.activeConversationId;
  state.messages.push({ role: 'user', content: question }); renderMessages(); input.value = '';
  document.getElementById('chips').classList.add('hidden'); setLoading(true);
  const vinyl = document.getElementById('vinyl-container'); const loadingText = document.getElementById('loading-text');
  vinyl.classList.remove('hidden'); vinyl.classList.add('spinning'); loadingText.classList.remove('hidden');
  loadingText.textContent = loadingPhrases[Math.floor(Math.random() * loadingPhrases.length)];
  try {
    const response = await fetch('/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ conversation_id: conversationId, question }) });
    if (response.status === 404) {
      state.messages.pop(); state.activeConversationId = null; localStorage.removeItem(ACTIVE_CONVERSATION_KEY);
      await refreshConversations(); renderMessages(); await createConversation();
      throw new Error('That conversation was deleted. A new chat is ready.');
    }
    if (!response.ok) throw new Error(await readError(response));
    const data = await response.json();
    if (state.activeConversationId === data.conversation_id) {
      state.messages.push({ role: 'assistant', content: data.answer, interaction_id: data.interaction_id, sources: data.sources, feedback: null });
      renderMessages(); await refreshConversations();
    }
  } catch (error) {
    console.error(error); showToast(error.message || "Couldn't reach the server.");
  } finally {
    vinyl.classList.remove('spinning'); vinyl.classList.add('hidden'); loadingText.classList.add('hidden'); setLoading(false);
  }
}

async function sendFeedback(message, value, feedbackElement, thanksElement) {
  if (!state.activeConversationId || !message.interaction_id) return;
  const response = await fetch('/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ conversation_id: state.activeConversationId, interaction_id: message.interaction_id, feedback: value }) });
  if (!response.ok) return showToast(await readError(response));
  message.feedback = value; feedbackElement.classList.add('hidden'); thanksElement.classList.add('visible');
}

function askChip(chip) { document.getElementById('q').value = chip.textContent; ask(); }

document.getElementById('ask-btn').addEventListener('click', ask);
document.getElementById('new-chat-btn').addEventListener('click', () => createConversation().catch(error => showToast(error.message)));
document.getElementById('delete-chat-btn').addEventListener('click', () => deleteActiveConversation().catch(error => showToast(error.message)));
document.getElementById('q').addEventListener('keydown', event => { if (event.key === 'Enter' && !event.target.disabled) ask(); });

(async () => {
  try {
    await refreshConversations();
    const savedId = localStorage.getItem(ACTIVE_CONVERSATION_KEY);
    if (savedId && state.conversations.some(conversation => conversation.id === savedId)) await openConversation(savedId);
    else if (state.conversations.length) await openConversation(state.conversations[0].id);
    else await createConversation();
  } catch (error) { showToast(error.message || "Couldn't load conversation history."); }
})();
</script>
</body>
</html>
