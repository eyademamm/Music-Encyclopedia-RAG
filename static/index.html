<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Crate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@18.0.11/lib/marked.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.14/dist/purify.min.js"></script>
<style>
  :root {
    --bg-deep: #0f0c0c;
    --bg-surface: #1a1416;
    --bg-surface-alt: #241c1f;
    --accent-primary: #8b2252;
    --accent-secondary: #c4727a;
    --accent-hover: #a03060;
    --accent-glow: rgba(139, 34, 82, 0.32);
    --text-primary: #f8f0e3;
    --text-secondary: #cdbfae;
    --text-muted: #a29184;
    --border: #36282b;
    --shadow: rgba(0, 0, 0, 0.42);
    --error-red: #e35b5b;
  }

  * { box-sizing: border-box; }
  html { background: var(--bg-deep); }
  body {
    min-width: 0; min-height: 100vh; margin: 0; color: var(--text-primary); font-family: Inter, sans-serif;
    background-color: var(--bg-deep);
    background-image:
      repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,.008) 40px, rgba(255,255,255,.008) 41px),
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(80,40,30,.06) 2px, rgba(80,40,30,.06) 4px),
      radial-gradient(ellipse at 50% 0%, rgba(139,34,82,.08), transparent 70%);
  }
  button, textarea { font: inherit; }
  button { color: inherit; }
  button:not(:disabled) { cursor: pointer; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent-secondary); outline-offset: 3px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

  .app-shell { width: min(1120px, calc(100% - 48px)); min-height: 100vh; margin: 0 auto; display: grid; grid-template-columns: 252px minmax(0, 1fr); gap: clamp(28px, 5vw, 72px); }
  .sidebar { position: sticky; top: 0; height: 100vh; padding: 34px 0 28px; display: flex; flex-direction: column; border-right: 1px solid rgba(205,191,174,.14); }
  .brand { display: block; color: inherit; text-decoration: none; margin-bottom: 36px; }
  .brand-lockup { display: flex; align-items: center; gap: 10px; }
  .brand h1, .mobile-brand { margin: 0; color: var(--text-primary); font: 700 31px/1 'Playfair Display', serif; letter-spacing: -.02em; }
  .vinyl-icon { width: 31px; height: 31px; flex: 0 0 auto; }
  .brand p { margin: 5px 0 0 42px; color: var(--accent-secondary); font: italic 14px/1.2 'Playfair Display', serif; }
  .new-chat-btn { width: 100%; min-height: 44px; padding: 10px 13px; border: 1px solid rgba(196,114,122,.55); border-radius: 9px; background: rgba(139,34,82,.25); color: var(--text-primary); text-align: left; font-weight: 600; transition: background .16s ease, border-color .16s ease; }
  .new-chat-btn:hover:not(:disabled) { background: rgba(139,34,82,.42); border-color: var(--accent-secondary); }
  .new-chat-btn span { color: var(--accent-secondary); font-size: 18px; margin-right: 6px; }
  .sidebar-section-label { margin: 28px 0 9px; color: var(--text-muted); font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
  .conversation-list { overflow-y: auto; padding: 0 10px 12px 0; }
  .conversation-group + .conversation-group { margin-top: 21px; }
  .conversation-group-title { margin: 0 0 5px; color: var(--text-muted); font-size: 11px; font-weight: 600; }
  .conversation-list ul { display: grid; gap: 3px; margin: 0; padding: 0; list-style: none; }
  .conversation-item { position: relative; width: 100%; padding: 9px 10px 9px 13px; border: 0; border-radius: 7px; background: transparent; color: var(--text-secondary); text-align: left; transition: background .16s ease, color .16s ease; }
  .conversation-item::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; border-radius: 2px; background: transparent; }
  .conversation-item:hover { background: rgba(255,255,255,.045); color: var(--text-primary); }
  .conversation-item[aria-current="page"] { background: rgba(139,34,82,.22); color: var(--text-primary); }
  .conversation-item[aria-current="page"]::before { background: var(--accent-secondary); }
  .conversation-name { display: -webkit-box; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-height: 1.35; font-size: 13px; }
  .conversation-meta { display: block; margin-top: 4px; color: var(--text-muted); font-size: 11px; }
  .sidebar-empty { margin: 7px 4px; color: var(--text-muted); font: italic 14px/1.5 'Playfair Display', serif; }

  main { min-width: 0; padding: 38px 0 30px; }
  .mobile-header { display: none; }
  .chat-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
  .eyebrow { margin: 0 0 5px; color: var(--accent-secondary); font: 600 11px/1.2 Inter, sans-serif; letter-spacing: .15em; text-transform: uppercase; }
  .chat-head h2 { margin: 0; font: 600 28px/1.15 'Playfair Display', serif; letter-spacing: -.015em; }
  .delete-chat-btn { min-height: 38px; padding: 8px 10px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--text-muted); font-size: 12px; }
  .delete-chat-btn:hover:not(:disabled) { border-color: rgba(227,91,91,.45); color: #f5a3a3; background: rgba(227,91,91,.08); }
  .delete-chat-btn:disabled { opacity: .45; cursor: not-allowed; }

  .transcript { min-height: min(49vh, 560px); padding-bottom: 24px; }
  .message-list { display: grid; gap: 26px; }
  .message { min-width: 0; }
  .message-user { display: grid; justify-items: end; }
  .message-user .message-body { max-width: min(82%, 590px); padding: 11px 14px; border-radius: 14px 14px 4px 14px; background: linear-gradient(135deg, #8b2252, #742044); color: #fff7ee; box-shadow: 0 5px 14px rgba(0,0,0,.22); font-size: 14px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .message-assistant { padding: 2px 0 2px 18px; border-left: 2px solid var(--accent-primary); }
  .message-kicker { margin: 0 0 9px; color: var(--accent-secondary); font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
  .answer-content { max-width: 700px; color: var(--text-primary); font-size: 16px; line-height: 1.68; overflow-wrap: anywhere; }
  .answer-content h1, .answer-content h2, .answer-content h3 { margin: 1.2em 0 .45em; font-family: 'Playfair Display', serif; line-height: 1.2; }
  .answer-content h1 { font-size: 1.42em; } .answer-content h2 { font-size: 1.23em; } .answer-content h3 { font-size: 1.08em; }
  .answer-content p { margin: 0 0 .9em; } .answer-content p:last-child { margin-bottom: 0; }
  .answer-content strong { color: #fff; } .answer-content em { color: var(--accent-secondary); }
  .answer-content ul, .answer-content ol { margin: 0 0 .9em; padding-left: 1.4em; }
  .answer-content li { margin-bottom: .34em; } .answer-content li::marker { color: var(--accent-secondary); }
  .answer-content blockquote { margin: 1em 0; padding-left: 14px; border-left: 2px solid var(--accent-secondary); color: var(--text-secondary); }
  .answer-content code { padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,.07); font: .88em ui-monospace, SFMono-Regular, Consolas, monospace; }
  .answer-content pre { overflow-x: auto; padding: 12px; border-radius: 7px; background: rgba(0,0,0,.22); }.answer-content pre code { padding: 0; background: none; }
  .answer-content table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; }.answer-content th, .answer-content td { padding: 7px; border: 1px solid var(--border); text-align: left; }
  .answer-content a { color: var(--accent-secondary); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  .answer-content .reveal-block { display: none; }
  .answer-content .reveal-block.is-visible { display: block; animation: liner-note-reveal .18s ease-out both; }
  .answer-content li.reveal-block.is-visible { display: list-item; }
  @keyframes liner-note-reveal { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  .answer-footer { display: grid; gap: 14px; margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(205,191,174,.14); }
  .detail-label { display: block; margin-bottom: 7px; color: var(--text-muted); font-size: 10px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
  .tool-trace { display: flex; flex-wrap: wrap; gap: 3px 0; margin: 0; padding: 0; list-style: none; color: var(--text-secondary); font-size: 12px; }
  .tool-trace li { display: inline-flex; align-items: center; }.tool-trace li + li::before { content: '→'; margin: 0 7px; color: var(--accent-secondary); }
  .sources { display: flex; flex-wrap: wrap; gap: 7px; margin: 0; padding: 0; list-style: none; }.source-pill { max-width: 100%; padding: 5px 9px; border-radius: 999px; background: rgba(255,255,255,.045); color: var(--text-secondary); font-size: 12px; line-height: 1.35; overflow-wrap: anywhere; }
  .feedback { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }.feedback button { min-height: 34px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 7px; background: transparent; color: var(--text-secondary); font-size: 12px; transition: border-color .16s ease, background .16s ease, color .16s ease; }
  .feedback button:hover:not(:disabled), .feedback button[aria-pressed="true"] { border-color: var(--accent-secondary); color: var(--text-primary); background: rgba(139,34,82,.18); }.feedback button:disabled { opacity: .55; cursor: wait; }.feedback-note { color: var(--accent-secondary); font: italic 12px/1.4 'Playfair Display', serif; }

  .pending-message, .error-message { padding: 13px 15px; border-radius: 8px; background: rgba(255,255,255,.035); }.pending-message { display: flex; align-items: center; gap: 11px; color: var(--text-secondary); font: italic 14px/1.4 'Playfair Display', serif; }
  .mini-record { width: 30px; height: 30px; flex: 0 0 auto; border-radius: 50%; background: repeating-radial-gradient(circle, #111 0, #1b1b1b 1px, #111 4px); position: relative; }.mini-record::after { content: ''; position: absolute; inset: 10px; border-radius: 50%; background: var(--accent-primary); }.pending-message .mini-record { animation: spin 1.8s linear infinite; }@keyframes spin { to { transform: rotate(360deg); } }
  .error-message { border-left: 2px solid var(--error-red); color: var(--text-secondary); font-size: 14px; line-height: 1.5; }.retry-btn { margin-top: 10px; min-height: 34px; padding: 6px 10px; border: 1px solid rgba(227,91,91,.55); border-radius: 7px; background: transparent; color: #f3aaaa; font-size: 12px; }.retry-btn:hover { background: rgba(227,91,91,.1); }

  .empty-state { display: grid; place-items: center; min-height: 390px; padding: 30px 16px; text-align: center; }.empty-state-inner { max-width: 480px; }.hero-record { width: 92px; height: 92px; margin: 0 auto 22px; border-radius: 50%; background: repeating-radial-gradient(circle, #101010 0, #1b1b1b 1px, #101010 4px); box-shadow: 0 10px 25px var(--shadow); position: relative; }.hero-record::before { content: ''; position: absolute; inset: 27px; border: 1px solid rgba(255,255,255,.18); border-radius: 50%; background: radial-gradient(circle, var(--accent-primary), #681a3e); }.hero-record::after { content: ''; position: absolute; inset: 43px; border-radius: 50%; background: var(--bg-deep); }
  .empty-state h3 { margin: 0; font: 600 27px/1.2 'Playfair Display', serif; }.empty-state p { max-width: 390px; margin: 10px auto 20px; color: var(--text-secondary); font-size: 14px; line-height: 1.55; }.prompt-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }.prompt-chip { min-height: 34px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 999px; background: rgba(255,255,255,.025); color: var(--accent-secondary); font-size: 12px; }.prompt-chip:hover { border-color: var(--accent-primary); background: rgba(139,34,82,.16); color: var(--text-primary); }

  .composer-wrap { position: sticky; bottom: 0; padding: 16px 0 max(4px, env(safe-area-inset-bottom)); background: linear-gradient(to bottom, transparent, var(--bg-deep) 24px); }.composer { padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-surface); box-shadow: 0 8px 22px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.025); }.composer-label { display: block; margin: 0 0 7px 3px; color: var(--accent-secondary); font: italic 13px/1.2 'Playfair Display', serif; }.composer-row { display: flex; align-items: flex-end; gap: 10px; }.composer textarea { width: 100%; min-height: 45px; max-height: 156px; padding: 11px 12px; resize: none; border: 1px solid transparent; border-radius: 8px; background: var(--bg-surface-alt); color: var(--text-primary); line-height: 1.45; }.composer textarea::placeholder { color: var(--text-muted); }.composer textarea:focus { border-color: var(--accent-primary); outline: none; box-shadow: 0 0 0 3px var(--accent-glow); }
  .send-btn, .cancel-btn { min-height: 45px; border-radius: 8px; font-weight: 700; font-size: 13px; white-space: nowrap; }.send-btn { padding: 10px 13px; border: 1px solid var(--accent-primary); background: var(--accent-primary); color: var(--text-primary); box-shadow: 0 4px 10px rgba(139,34,82,.28); }.send-btn:hover:not(:disabled) { background: var(--accent-hover); }.send-btn:disabled { opacity: .5; cursor: not-allowed; }.cancel-btn { padding: 10px 11px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); }.cancel-btn:hover { border-color: var(--accent-secondary); color: var(--text-primary); }.composer-help { margin: 8px 3px 0; color: var(--text-muted); font-size: 11px; }

  .toast-region { position: fixed; top: 18px; right: 18px; z-index: 20; width: min(370px, calc(100% - 36px)); }.toast { display: flex; align-items: flex-start; gap: 10px; padding: 13px 14px; border-left: 3px solid var(--error-red); border-radius: 8px; background: #28191b; box-shadow: 0 10px 24px var(--shadow); color: var(--text-primary); font-size: 13px; line-height: 1.45; }.toast p { flex: 1; margin: 0; }.toast button { width: 28px; height: 28px; border: 0; border-radius: 5px; background: transparent; color: var(--text-muted); font-size: 17px; }.toast button:hover { color: var(--text-primary); background: rgba(255,255,255,.06); }.mobile-menu-btn, .sidebar-scrim { display: none; }

  @media (max-width: 760px) {
    .app-shell { width: 100%; display: block; }.sidebar { position: fixed; z-index: 15; top: 0; bottom: 0; left: 0; width: min(310px, calc(100vw - 42px)); height: auto; padding: 24px 18px; background: #171114; border-right: 1px solid var(--border); box-shadow: 18px 0 36px rgba(0,0,0,.45); transform: translateX(-105%); transition: transform .18s ease; }.sidebar.open { transform: translateX(0); }.sidebar-scrim { position: fixed; inset: 0; z-index: 14; border: 0; background: rgba(0,0,0,.55); }.sidebar-scrim.visible { display: block; }
    main { padding: 20px 16px 16px; }.mobile-header { display: flex; align-items: center; gap: 11px; margin-bottom: 27px; }.mobile-menu-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-surface); color: var(--text-primary); font-size: 20px; }.mobile-brand { font-size: 27px; }.chat-head { margin-bottom: 20px; }.chat-head h2 { font-size: 25px; }.transcript { min-height: calc(100svh - 270px); }.message-list { gap: 22px; }.message-user .message-body { max-width: 90%; }.message-assistant { padding-left: 14px; }.answer-content { font-size: 15px; line-height: 1.64; }.empty-state { min-height: calc(100svh - 310px); padding: 18px 0 32px; }.composer-wrap { margin: 0 -2px; }.composer-row { gap: 8px; }.send-btn { padding: 10px; }.send-btn .send-label { display: none; }.send-btn .send-short { display: inline; }
  }
  @media (min-width: 761px) { .send-short { display: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }.answer-content .reveal-block { display: revert; opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="conversation-sidebar" aria-label="Conversation history">
      <a class="brand" href="/" aria-label="The Crate home">
        <span class="brand-lockup">
          <svg class="vinyl-icon" viewBox="0 0 100 100" fill="none" aria-hidden="true"><circle cx="50" cy="50" r="48" stroke="var(--text-secondary)" stroke-width="2" fill="#111"/><circle cx="50" cy="50" r="38" stroke="var(--text-muted)" stroke-width=".5"/><circle cx="50" cy="50" r="30" stroke="var(--text-muted)" stroke-width=".5"/><circle cx="50" cy="50" r="16" fill="var(--accent-primary)" stroke="var(--accent-secondary)"/><circle cx="50" cy="50" r="4" fill="#0f0c0c"/></svg>
          <h1>The Crate</h1>
        </span>
        <p>Dig through the stacks</p>
      </a>
      <button class="new-chat-btn" id="new-chat-btn" type="button"><span aria-hidden="true">+</span>New Chat</button>
      <p class="sidebar-section-label">Your sessions</p>
      <nav class="conversation-list" id="conversation-list" aria-label="Previous conversations"></nav>
    </aside>
    <button class="sidebar-scrim" id="sidebar-scrim" type="button" aria-label="Close conversations"></button>
    <main>
      <header class="mobile-header"><button class="mobile-menu-btn" id="mobile-menu-btn" type="button" aria-expanded="false" aria-controls="conversation-sidebar" aria-label="Open conversations">☰</button><p class="mobile-brand">The Crate</p></header>
      <section class="chat-panel" id="chat-panel" aria-labelledby="conversation-heading">
        <header class="chat-head"><div><p class="eyebrow">Listening session</p><h2 id="conversation-heading">New Chat</h2></div><button class="delete-chat-btn" id="delete-chat-btn" type="button" disabled>Delete chat</button></header>
        <div class="transcript"><div class="message-list" id="conversation-messages" role="log" aria-live="off" aria-relevant="additions text" aria-label="Conversation transcript"></div></div>
      </section>
      <div class="composer-wrap">
        <form class="composer" id="composer-form">
          <label class="composer-label" for="q">Ask The Crate</label>
          <div class="composer-row"><textarea id="q" rows="1" maxlength="2000" placeholder="Ask about an artist, genre, or era…" aria-describedby="composer-help"></textarea><button class="send-btn" id="ask-btn" type="submit"><span class="send-label">Drop the Needle</span><span class="send-short" aria-hidden="true">Send</span></button><button class="cancel-btn" id="cancel-btn" type="button" hidden>Stop</button></div>
          <p class="composer-help" id="composer-help">Enter to send · Shift+Enter for a new line</p>
        </form>
      </div>
    </main>
  </div>
  <div class="toast-region" id="toast-region"></div>
  <p class="sr-only" id="app-status" role="status" aria-live="polite" aria-atomic="true"></p>
<script>
const state = { conversations: [], activeConversationId: null, messages: [], request: null };
const ACTIVE_CONVERSATION_KEY = 'the-crate-active-conversation';
const TOOL_LABELS = { local_search: 'Searched the collection', wikipedia_search: 'Checked Wikipedia', lyrics_search: 'Consulted LRCLIB' };
const markdownSanitizerOptions = { ALLOWED_TAGS: ['p', 'br', 'strong', 'em', 'del', 'a', 'ul', 'ol', 'li', 'blockquote', 'code', 'pre', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'hr', 'table', 'thead', 'tbody', 'tr', 'th', 'td'], ALLOWED_ATTR: ['href', 'title'], RETURN_DOM_FRAGMENT: true };
if (typeof marked !== 'undefined') marked.setOptions({ breaks: true, gfm: true });

function messageId() { return `message-${crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`}`; }
function announce(message) { document.getElementById('app-status').textContent = message; }
function renderMarkdownSafely(text, element) { if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') { element.textContent = text; return; } element.replaceChildren(DOMPurify.sanitize(marked.parse(text), markdownSanitizerOptions)); }
function reducedMotionPreferred() { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
function revealBlocks(answer) {
  return Array.from(answer.children).flatMap(block => block.matches('ul, ol') ? Array.from(block.children).filter(item => item.matches('li')) : [block]);
}
function finishReveal(wrapper) {
  wrapper.querySelectorAll('.reveal-block').forEach(block => block.classList.add('is-visible'));
}
function cancelReveal(wrapper) {
  wrapper._revealController?.abort();
  finishReveal(wrapper);
}
function startProgressiveReveal(wrapper) {
  const blocks = revealBlocks(wrapper.querySelector('.answer-content') || document.createElement('div'));
  if (!blocks.length || reducedMotionPreferred()) { finishReveal(wrapper); return; }
  blocks.forEach(block => block.classList.add('reveal-block'));
  const controller = new AbortController(); wrapper._revealController = controller;
  let frameId = null; let timeoutId = null;
  controller.signal.addEventListener('abort', () => { if (frameId !== null) window.cancelAnimationFrame(frameId); if (timeoutId !== null) window.clearTimeout(timeoutId); }, { once: true });
  const revealNext = index => {
    if (controller.signal.aborted || !wrapper.isConnected) return;
    if (index >= blocks.length) { wrapper._revealController = null; return; }
    blocks[index].classList.add('is-visible');
    timeoutId = window.setTimeout(() => revealNext(index + 1), 95);
  };
  frameId = window.requestAnimationFrame(() => revealNext(0));
}
function showToast(message) { const region = document.getElementById('toast-region'); region.replaceChildren(); const toast = document.createElement('div'); toast.className = 'toast'; toast.setAttribute('role', 'alert'); const text = document.createElement('p'); text.textContent = String(message); const close = document.createElement('button'); close.type = 'button'; close.setAttribute('aria-label', 'Dismiss message'); close.textContent = '×'; close.addEventListener('click', () => toast.remove()); toast.append(text, close); region.appendChild(toast); window.setTimeout(() => toast.remove(), 7000); }
function relativeDate(timestamp) { const days = Math.floor((Date.now() - Number(timestamp || 0) * 1000) / 86400000); if (days <= 0) return 'Today'; if (days === 1) return 'Yesterday'; if (days < 7) return `${days} days ago`; return new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric' }).format(new Date(Number(timestamp) * 1000)); }
function groupLabel(timestamp) { const days = Math.floor((Date.now() - Number(timestamp || 0) * 1000) / 86400000); if (days <= 0) return 'Today'; if (days < 7) return 'Previous 7 days'; return 'Earlier'; }
function updateChatHeading() { const active = state.conversations.find(item => item.id === state.activeConversationId); document.getElementById('conversation-heading').textContent = active?.title || 'New Chat'; const button = document.getElementById('delete-chat-btn'); button.disabled = !active; button.setAttribute('aria-label', active ? `Delete conversation: ${active.title}` : 'Delete active conversation'); }
function renderConversationList() {
  const nav = document.getElementById('conversation-list'); nav.replaceChildren();
  if (!state.conversations.length) { const empty = document.createElement('p'); empty.className = 'sidebar-empty'; empty.textContent = 'Your next deep cut starts here.'; nav.appendChild(empty); return; }
  const groups = new Map(); state.conversations.forEach(conversation => { const label = groupLabel(conversation.updated_at); if (!groups.has(label)) groups.set(label, []); groups.get(label).push(conversation); });
  groups.forEach((conversations, label) => { const group = document.createElement('section'); group.className = 'conversation-group'; const heading = document.createElement('h2'); heading.className = 'conversation-group-title'; heading.textContent = label; const list = document.createElement('ul');
    conversations.forEach(conversation => { const item = document.createElement('li'); const button = document.createElement('button'); button.type = 'button'; button.className = 'conversation-item'; if (conversation.id === state.activeConversationId) button.setAttribute('aria-current', 'page'); const title = document.createElement('span'); title.className = 'conversation-name'; title.textContent = conversation.title; title.title = conversation.title; const meta = document.createElement('span'); meta.className = 'conversation-meta'; const turns = Number(conversation.turn_count || 0); meta.textContent = `${turns} ${turns === 1 ? 'turn' : 'turns'} · ${relativeDate(conversation.updated_at)}`; button.append(title, meta); button.addEventListener('click', () => openConversation(conversation.id)); item.appendChild(button); list.appendChild(item); });
    group.append(heading, list); nav.appendChild(group);
  });
}
function createUserElement(message) { const wrapper = document.createElement('article'); wrapper.className = 'message message-user'; wrapper.dataset.messageId = message.id; wrapper.setAttribute('aria-label', 'Your message'); const body = document.createElement('div'); body.className = 'message-body'; body.textContent = message.content; wrapper.appendChild(body); return wrapper; }
function renderTrace(tools) { if (!tools?.length) return null; const section = document.createElement('section'); const title = document.createElement('span'); title.className = 'detail-label'; title.textContent = 'Research path'; const list = document.createElement('ol'); list.className = 'tool-trace'; tools.forEach(tool => { const item = document.createElement('li'); item.textContent = TOOL_LABELS[tool] || 'Consulted a music source'; list.appendChild(item); }); section.append(title, list); return section; }
function renderSources(sources) { if (!sources?.length) return null; const section = document.createElement('section'); const title = document.createElement('span'); title.className = 'detail-label'; title.textContent = 'From the collection'; const list = document.createElement('ul'); list.className = 'sources'; sources.forEach(source => { const item = document.createElement('li'); item.className = 'source-pill'; item.textContent = String(source); list.appendChild(item); }); section.append(title, list); return section; }
function renderFeedback(message) {
  if (!message.interaction_id) return null;
  const section = document.createElement('section'); const label = document.createElement('span'); label.className = 'detail-label'; label.textContent = 'Rate this answer'; const group = document.createElement('div'); group.className = 'feedback'; group.setAttribute('role', 'group'); group.setAttribute('aria-label', 'Rate this answer');
  [[1, 'Solid track'], [-1, 'Skip']].forEach(([value, text]) => { const button = document.createElement('button'); button.type = 'button'; button.textContent = value === 1 ? `👍 ${text}` : `👎 ${text}`; button.setAttribute('aria-pressed', String(message.feedback === value)); button.setAttribute('aria-label', `${text}: rate this answer`); button.addEventListener('click', () => sendFeedback(message, value)); group.appendChild(button); });
  if (message.feedback) { const note = document.createElement('span'); note.className = 'feedback-note'; note.textContent = message.feedback === 1 ? 'Marked as a solid track.' : 'Marked to skip.'; group.appendChild(note); }
  section.append(label, group); return section;
}
function createAssistantElement(message) {
  const wrapper = document.createElement('article'); wrapper.className = 'message message-assistant'; wrapper.dataset.messageId = message.id; wrapper.setAttribute('aria-label', 'The Crate response');
  if (message.pending) { const pending = document.createElement('div'); pending.className = 'pending-message'; pending.setAttribute('role', 'status'); const record = document.createElement('span'); record.className = 'mini-record'; record.setAttribute('aria-hidden', 'true'); const text = document.createElement('span'); text.textContent = 'Flipping through the crates…'; pending.append(record, text); wrapper.appendChild(pending); return wrapper; }
  if (message.error) { const error = document.createElement('div'); error.className = 'error-message'; error.setAttribute('role', 'alert'); const text = document.createElement('div'); text.textContent = message.error; const retry = document.createElement('button'); retry.type = 'button'; retry.className = 'retry-btn'; retry.textContent = message.cancelled ? 'Refresh chat' : 'Try again'; retry.addEventListener('click', () => retryMessage(message)); error.append(text, retry); wrapper.appendChild(error); return wrapper; }
  const kicker = document.createElement('p'); kicker.className = 'message-kicker'; kicker.textContent = 'Liner Notes'; const answer = document.createElement('div'); answer.className = 'answer-content'; renderMarkdownSafely(message.content, answer); wrapper.append(kicker, answer);
  const footer = document.createElement('footer'); footer.className = 'answer-footer'; [renderTrace(message.tools_used), renderSources(message.sources), renderFeedback(message)].filter(Boolean).forEach(part => footer.appendChild(part)); if (footer.childElementCount) wrapper.appendChild(footer); return wrapper;
}
function mountMessage(message, list = document.getElementById('conversation-messages')) {
  const element = message.role === 'user' ? createUserElement(message) : createAssistantElement(message);
  list.appendChild(element);
  if (message.reveal) { message.reveal = false; startProgressiveReveal(element); }
  return element;
}
function appendMessage(message) { return mountMessage(message); }
function replaceMessage(message) {
  const previous = document.querySelector(`[data-message-id="${message.id}"]`); const next = message.role === 'user' ? createUserElement(message) : createAssistantElement(message);
  if (previous) { cancelReveal(previous); previous.replaceWith(next); } else document.getElementById('conversation-messages').appendChild(next);
  if (message.reveal) { message.reveal = false; startProgressiveReveal(next); }
  return next;
}
function renderMessages() {
  const list = document.getElementById('conversation-messages'); Array.from(list.children).forEach(cancelReveal); list.replaceChildren();
  if (!state.messages.length) { renderEmptyState(list); return; } state.messages.forEach(message => mountMessage(message, list));
}
function renderEmptyState(list) {
  const empty = document.createElement('section'); empty.className = 'empty-state'; empty.setAttribute('aria-label', 'Start a new conversation'); const inner = document.createElement('div'); inner.className = 'empty-state-inner'; const record = document.createElement('div'); record.className = 'hero-record'; record.setAttribute('aria-hidden', 'true'); const heading = document.createElement('h3'); heading.textContent = 'Start a fresh side of the record.'; const copy = document.createElement('p'); copy.textContent = 'Follow an artist through the decades, trace a genre’s roots, or pull apart a song’s story.'; const chips = document.createElement('div'); chips.className = 'prompt-chips'; chips.setAttribute('aria-label', 'Suggested questions');
  ['Who were the members of Pink Floyd?', 'What genre did Fela Kuti pioneer?', 'Tell me about Tame Impala'].forEach(question => { const button = document.createElement('button'); button.type = 'button'; button.className = 'prompt-chip'; button.textContent = question; button.addEventListener('click', () => { const input = document.getElementById('q'); input.value = question; autoResize(input); input.focus(); }); chips.appendChild(button); });
  inner.append(record, heading, copy, chips); empty.appendChild(inner); list.appendChild(empty);
}
function syncComposer() { const activeLoading = state.request?.conversationId === state.activeConversationId; const busy = Boolean(state.request); document.getElementById('ask-btn').disabled = busy; document.getElementById('q').disabled = busy; document.getElementById('cancel-btn').hidden = !activeLoading; document.getElementById('chat-panel').setAttribute('aria-busy', String(Boolean(activeLoading))); }
function autoResize(textarea) { textarea.style.height = 'auto'; textarea.style.height = `${Math.min(textarea.scrollHeight, 156)}px`; }
function closeSidebar() { document.getElementById('conversation-sidebar').classList.remove('open'); document.getElementById('sidebar-scrim').classList.remove('visible'); document.getElementById('mobile-menu-btn').setAttribute('aria-expanded', 'false'); }
function openSidebar() { document.getElementById('conversation-sidebar').classList.add('open'); document.getElementById('sidebar-scrim').classList.add('visible'); document.getElementById('mobile-menu-btn').setAttribute('aria-expanded', 'true'); }
async function readError(response) { try { return (await response.json()).detail || `Server returned ${response.status}`; } catch (_) { return `Server returned ${response.status}`; } }
async function refreshConversations() { const response = await fetch('/conversations'); if (!response.ok) throw new Error(await readError(response)); state.conversations = (await response.json()).conversations || []; renderConversationList(); updateChatHeading(); }
async function createConversation() { const response = await fetch('/conversations', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }); if (!response.ok) throw new Error(await readError(response)); return response.json(); }
function startNewChat() { state.activeConversationId = null; state.messages = []; localStorage.removeItem(ACTIVE_CONVERSATION_KEY); renderConversationList(); updateChatHeading(); renderMessages(); syncComposer(); closeSidebar(); const input = document.getElementById('q'); input.value = ''; autoResize(input); input.focus(); announce('New chat ready.'); }
async function openConversation(conversationId) {
  if (conversationId === state.activeConversationId) { closeSidebar(); return; }
  try { const response = await fetch(`/conversations/${encodeURIComponent(conversationId)}`); if (response.status === 404) { localStorage.removeItem(ACTIVE_CONVERSATION_KEY); await refreshConversations(); startNewChat(); return; } if (!response.ok) throw new Error(await readError(response)); const data = await response.json(); state.activeConversationId = data.conversation.id; state.messages = (data.messages || []).map(message => ({ ...message, id: messageId() })); localStorage.setItem(ACTIVE_CONVERSATION_KEY, state.activeConversationId); renderConversationList(); updateChatHeading(); renderMessages(); syncComposer(); closeSidebar(); announce(`Opened conversation: ${data.conversation.title}.`); } catch (error) { showToast(error.message || "Couldn't load that conversation."); }
}
async function deleteActiveConversation() {
  const active = state.conversations.find(item => item.id === state.activeConversationId); if (!active) return; if (!window.confirm(`Delete “${active.title}”? This removes its saved turns.`)) return;
  try { const response = await fetch(`/conversations/${encodeURIComponent(active.id)}`, { method: 'DELETE' }); if (response.status !== 204 && response.status !== 404) throw new Error(await readError(response)); startNewChat(); await refreshConversations(); announce('Conversation deleted.'); } catch (error) { showToast(error.message || "Couldn't delete that conversation."); }
}
async function sendQuestion(question, existingAssistantId = null) {
  if (!question || state.request) return; let conversationId = state.activeConversationId;
  try {
    if (!conversationId) { const conversation = await createConversation(); conversationId = conversation.id; state.activeConversationId = conversationId; localStorage.setItem(ACTIVE_CONVERSATION_KEY, conversationId); await refreshConversations(); updateChatHeading(); }
    let assistant;
    if (existingAssistantId) { assistant = state.messages.find(message => message.id === existingAssistantId); assistant.pending = true; assistant.error = null; replaceMessage(assistant); }
    else { const user = { id: messageId(), role: 'user', content: question }; assistant = { id: messageId(), role: 'assistant', pending: true, retryQuestion: question }; state.messages.push(user, assistant); const list = document.getElementById('conversation-messages'); if (list.querySelector('.empty-state')) list.replaceChildren(); appendMessage(user); appendMessage(assistant); }
    const controller = new AbortController(); const request = { conversationId, assistantId: assistant.id, question, controller }; state.request = request; syncComposer(); announce('Searching the collection.');
    const response = await fetch('/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ conversation_id: conversationId, question }), signal: controller.signal }); if (!response.ok) throw new Error(await readError(response)); const data = await response.json();
    assistant.pending = false; assistant.cancelled = false; assistant.reveal = true; assistant.content = data.answer; assistant.interaction_id = data.interaction_id; assistant.sources = data.sources || []; assistant.tools_used = data.tools_used || []; assistant.feedback = null; if (state.activeConversationId === conversationId) replaceMessage(assistant); await refreshConversations(); announce('Answer ready.');
  } catch (error) {
    const assistant = state.messages.find(message => message.id === (state.request?.assistantId || existingAssistantId));
    if (assistant) { assistant.pending = false; assistant.cancelled = error.name === 'AbortError'; assistant.error = assistant.cancelled ? 'Request stopped. The server may still finish this answer; refresh this chat to check.' : (error.message || "Couldn't reach the collection. Try again."); if (state.activeConversationId === (state.request?.conversationId || state.activeConversationId)) replaceMessage(assistant); }
    if (error.name !== 'AbortError') { showToast(error.message || "Couldn't reach the collection."); announce('The request failed. You can try again.'); } else announce('Request stopped.');
  } finally { if (state.request?.conversationId === conversationId) state.request = null; syncComposer(); }
}
async function retryMessage(message) { if (state.request) return; if (message.cancelled) { const conversationId = state.activeConversationId; if (!conversationId) return; state.activeConversationId = null; await openConversation(conversationId); return; } if (message.retryQuestion) sendQuestion(message.retryQuestion, message.id); }
function cancelActiveRequest() { if (!state.request || state.request.conversationId !== state.activeConversationId) return; state.request.controller.abort(); }
async function sendFeedback(message, value) {
  if (!state.activeConversationId || !message.interaction_id) return; const buttons = document.querySelectorAll(`[data-message-id="${message.id}"] .feedback button`); buttons.forEach(button => { button.disabled = true; });
  try { const response = await fetch('/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ conversation_id: state.activeConversationId, interaction_id: message.interaction_id, feedback: value }) }); if (!response.ok) throw new Error(await readError(response)); message.feedback = value; replaceMessage(message); announce(value === 1 ? 'Marked as a solid track.' : 'Marked to skip.'); } catch (error) { buttons.forEach(button => { button.disabled = false; }); showToast(error.message || "Couldn't save that rating."); announce("Couldn't save that rating."); }
}

document.getElementById('composer-form').addEventListener('submit', event => { event.preventDefault(); const input = document.getElementById('q'); const question = input.value.trim(); if (!question || state.request) return; input.value = ''; autoResize(input); sendQuestion(question); });
document.getElementById('q').addEventListener('input', event => autoResize(event.target));
document.getElementById('q').addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); document.getElementById('composer-form').requestSubmit(); } });
document.getElementById('new-chat-btn').addEventListener('click', startNewChat);
document.getElementById('delete-chat-btn').addEventListener('click', deleteActiveConversation);
document.getElementById('cancel-btn').addEventListener('click', cancelActiveRequest);
document.getElementById('mobile-menu-btn').addEventListener('click', () => document.getElementById('conversation-sidebar').classList.contains('open') ? closeSidebar() : openSidebar());
document.getElementById('sidebar-scrim').addEventListener('click', closeSidebar);
document.addEventListener('keydown', event => { if (event.key === 'Escape') closeSidebar(); });
(async () => {
  try { await refreshConversations(); const savedId = localStorage.getItem(ACTIVE_CONVERSATION_KEY); if (savedId && state.conversations.some(conversation => conversation.id === savedId)) await openConversation(savedId); else { updateChatHeading(); renderMessages(); syncComposer(); } }
  catch (error) { renderMessages(); syncComposer(); showToast(error.message || "Couldn't load conversation history."); }
})();
</script>
